services:
  # Backend API on Render Free Web Service
  - type: web
    name: transport-severa-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false
        # Вставьте строку подключения от MongoDB Atlas (бесплатный M0 кластер):
        # mongodb+srv://<username>:<password>@cluster0.mongodb.net/transport_severa?retryWrites=true&w=majority
      - key: MONGODB_DB_NAME
        value: transport_severa
      - key: YANDEX_RASP_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'

  # Frontend on Render Free Static Site (или можно на Vercel)
  - type: web
    name: transport-severa-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://transport-severa-backend.onrender.com/api
